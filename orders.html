<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Orders</title>
        <link rel="stylesheet" href="styles.css" th:href="@{/styles.css}">
    </head>
    <body>
        <h1>Orders</h1>
        <h2>Add Order</h2>
        <form>
            <label for="orderNumber">Order Number:</label>
            <input type="text" id="orderNumber" name="orderNumber" required><br>
            <label for="tableNumber">Table Number:</label>
            <input type="text" id="tableNumber" name="tableNumber" required><br>
            <label for="items">Items (comma-separated):</label>
            <input type="text" id="items" name="items" required><br>
            <button type="submit">Add Order</button>
        </form>
    </body>
</html>
