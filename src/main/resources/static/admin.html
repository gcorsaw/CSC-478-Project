<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Admin / Maintenance Workspace | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="staff-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Admin / Maintenance workspace</span>
    </header>
    <main class="staff-main">
        <p class="eyebrow">Staff access</p>
        <h1>Admin / Maintenance workspace</h1>
        <section class="staff-card">
            <h2>System health</h2>
            <p>This read-only check confirms the app can query PostgreSQL. It does not expose database credentials.</p>
            <button class="navi-button" id="refresh-health" type="button">Refresh system status</button>
            <div id="admin-health" class="role-stat-grid" aria-live="polite"></div>
            <p id="admin-feedback" class="role-feedback" role="status" aria-live="polite"></p>
        </section>
        <section class="staff-card">
            <h2>Staff directory</h2>
            <p>Password data is never returned to this page.</p>
            <ul id="staff-list"></ul>
        </section>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
