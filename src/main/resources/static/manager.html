<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Manager Workspace | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="staff-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Manager workspace</span>
    </header>
    <main class="staff-main">
        <p class="eyebrow">Staff access</p>
        <h1>Manager workspace</h1>
        <section class="staff-card">
            <h2>Floor and order overview</h2>
            <div class="role-stat-grid" id="manager-summary" aria-live="polite"></div>
            <p class="role-feedback" id="manager-feedback" role="status" aria-live="polite"></p>
        </section>
        <section class="staff-card">
            <h2>Recent orders</h2>
            <ul id="manager-orders"></ul>
            <a class="navi-button" href="orders.html">Create or review orders</a>
            <a class="navi-button" href="tables.html">Manage tables</a>
        </section>
        <section class="staff-card">
            <h2>Manager approval</h2>
            <form id="manager-override-form" class="role-form">
                <label for="override-username">Manager username</label>
                <input id="override-username" name="username" autocomplete="username" required>
                <label for="override-password">Manager override password</label>
                <input id="override-password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Verify manager</button>
                <p id="manager-override-feedback" class="role-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section class="staff-card">
            <h2>Create staff account</h2>
            <form id="staff-account-form" class="role-form">
                <label for="staff-name">Employee name</label>
                <input id="staff-name" name="name" maxlength="100" autocomplete="name" required>
                <label for="staff-username">Username</label>
                <input id="staff-username" name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" autocomplete="username" required>
                <label for="staff-password">Temporary password</label>
                <input id="staff-password" name="password" type="password" minlength="12" autocomplete="new-password" required>
                <label for="staff-role">Role</label>
                <select id="staff-role" name="role" required>
                    <option value="CHEF">Chef</option>
                    <option value="WAITER">Waiter</option>
                    <option value="HOST">Host</option>
                    <option value="MANAGER">Manager</option>
                    <option value="ADMIN">Admin</option>
                    <option value="OWNER">Owner</option>
                </select>
                <button type="submit">Create account</button>
                <p id="staff-account-feedback" class="role-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/manager.js"></script>
</body>
</html>
