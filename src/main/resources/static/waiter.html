<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Waiter Workspace | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="staff-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Waiter workspace</span>
    </header>
    <main class="staff-main">
        <p class="eyebrow">Front of house</p>
        <h1>Waiter workspace</h1>
        <section class="staff-card">
            <h2>Table status</h2>
            <p>Check table availability before starting or updating an order.</p>
            <div id="waiter-summary" class="role-stat-grid" aria-live="polite"></div>
            <div id="waiter-tables" class="waiter-table-grid" aria-live="polite"></div>
            <p id="waiter-feedback" class="role-feedback" role="status" aria-live="polite"></p>
        </section>
        <a class="navi-button staff-home-link" href="orders.html">Create or review orders</a>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/waiter.js"></script>
</body>
</html>
