<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Chef Station | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="staff-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Chef station</span>
    </header>
    <main class="staff-main">
        <p class="eyebrow">Kitchen</p>
        <h1>Chef station</h1>
        <section class="staff-card">
            <h2>Recent orders</h2>
            <p>Order status refreshes automatically.</p>
            <button class="navi-button" id="refresh-kitchen" type="button">Refresh orders</button>
            <div id="kitchen-orders" class="kitchen-order-grid" aria-live="polite"></div>
            <p id="kitchen-feedback" class="role-feedback" role="status" aria-live="polite"></p>
        </section>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/kitchen.js"></script>
</body>
</html>
