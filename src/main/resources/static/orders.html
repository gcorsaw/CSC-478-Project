<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Orders | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="data-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Order management</span>
    </header>
    <main class="data-main">
        <p class="eyebrow">Operations</p>
        <h1>Orders</h1>
        <section class="data-panel">
            <h2>Create an order</h2>
            <form id="orderForm" class="data-form">
                <label for="waiterSelect">Waiter</label>
                <select id="waiterSelect" required>
                    <option value="" disabled selected>Select an active waiter...</option>
                </select>

                <label for="tableSelect">Table</label>
                <select id="tableSelect" required>
                    <option value="" disabled selected>Select a dining table...</option>
                </select>

                <label for="itemSelect">Menu item</label>
                <select id="itemSelect" required>
                    <option value="" disabled selected>Choose a menu item...</option>
                </select>

                <label for="quantityInput">Quantity</label>
                <input type="number" id="quantityInput" value="1" min="1" required>
                <button type="button" id="addItemBtn">Add item</button>
            </form>

            <h3>Items in this order</h3>
            <ul id="currentOrderItems" class="staged-items"></ul>
            <button type="button" id="saveOrderBtn">Save order</button>
            <p id="errorMessage" class="data-feedback" role="status" aria-live="polite"></p>
        </section>

        <section class="data-panel">
            <h2>Recent orders</h2>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Order</th>
                            <th scope="col">Table</th>
                            <th scope="col">Status</th>
                            <th scope="col">Created</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </section>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
