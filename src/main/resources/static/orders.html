<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="data-page">
    <main class="data-main">
        <a class="navi-button" href="restaurant.html">Operations portal</a>
        <h1>Orders</h1>
        <section class="data-panel" aria-labelledby="add-order-heading">
            <h2 id="add-order-heading">Create Order</h2>
            <form id="order-form">
                <label for="waiterId">Waiter</label>
                <select id="waiterId" name="waiterId"></select>
                <label for="tableNumber">Occupied table</label>
                <select id="tableNumber" name="tableNumber" required></select>
                <label for="menuItem">Menu item</label>
                <select id="menuItem" name="menuItem" required></select>
                <label for="quantity">Quantity</label>
                <input id="quantity" name="quantity" type="number" min="1" max="50" value="1" required>
                <button id="add-item" type="button">Add item</button>
                <h3>Items in this order</h3>
                <ul id="selected-items"></ul>
                <button type="submit">Save Order</button>
            </form>
            <p id="order-feedback" class="data-feedback" role="status" aria-live="polite"></p>
        </section>
        <section class="data-panel" aria-labelledby="order-list-heading">
            <h2 id="order-list-heading">Recent Orders</h2>
            <ul id="order-list"></ul>
        </section>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
