<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173d32">
    <title>Restaurant Tables | Green Olives</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="data-page">
    <header class="staff-header">
        <a class="staff-brand" href="restaurant.html">Green Olives</a>
        <span>Table management</span>
    </header>
    <main class="data-main">
        <p class="eyebrow">Operations</p>
        <h1>Restaurant tables</h1>
        <section class="data-panel" aria-labelledby="add-table-heading">
            <h2 id="add-table-heading">Add a table</h2>
            <form id="table-form">
                <label for="tableNumber">Table number</label>
                <input type="number" id="tableNumber" name="tableNumber" min="1" required>
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" name="capacity" min="1" max="20" required>
                <button type="submit">Add table</button>
            </form>
            <p id="table-feedback" class="data-feedback" role="status" aria-live="polite"></p>
        </section>
        <section class="data-panel" aria-labelledby="table-list-heading">
            <h2 id="table-list-heading">Current tables</h2>
            <ul id="table-list"></ul>
        </section>
        <a class="navi-button staff-home-link" href="restaurant.html">Back to operations portal</a>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/tables.js"></script>
</body>
</html>
