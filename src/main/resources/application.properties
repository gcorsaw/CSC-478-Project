spring.application.name=restaurantapp
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically update schema elements on boot up
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keep templates path static matching your direct serving structure
spring.web.resources.static-locations=classpath:/static/
