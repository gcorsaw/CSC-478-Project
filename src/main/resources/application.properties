spring.application.name=restaurant-app

# Core connection paths pointing directly to the internal Docker network mesh
spring.datasource.url=jdbc:postgresql://postgres_db:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and initialization operational settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
