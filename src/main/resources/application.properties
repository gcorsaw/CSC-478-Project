spring.application.name=restaurant-app

# Core connection paths pointing directly to the internal Docker network mesh
spring.datasource.url=jdbc:postgresql://postgres_db:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# 1. Turn OFF Hibernate auto-updates so it does not override our queries
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 2. Turn ON explicit script execution on container startup
spring.sql.init.mode=always
