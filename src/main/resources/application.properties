server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5433/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=postgres_password
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
restaurant.manager.override-password=${RESTAURANT_MANAGER_OVERRIDE_PASSWORD:}
restaurant.auth.accounts.manager.username=${RESTAURANT_AUTH_MANAGER_USERNAME:manager}
restaurant.auth.accounts.manager.password=${RESTAURANT_AUTH_MANAGER_PASSWORD:}
restaurant.auth.accounts.owner.username=${RESTAURANT_AUTH_OWNER_USERNAME:owner}
restaurant.auth.accounts.owner.password=${RESTAURANT_AUTH_OWNER_PASSWORD:}
restaurant.auth.accounts.admin.username=${RESTAURANT_AUTH_ADMIN_USERNAME:admin}
restaurant.auth.accounts.admin.password=${RESTAURANT_AUTH_ADMIN_PASSWORD:}
restaurant.auth.accounts.chef.username=${RESTAURANT_AUTH_CHEF_USERNAME:chef}
restaurant.auth.accounts.chef.password=${RESTAURANT_AUTH_CHEF_PASSWORD:}
restaurant.auth.accounts.waiter.username=${RESTAURANT_AUTH_WAITER_USERNAME:waiter}
restaurant.auth.accounts.waiter.password=${RESTAURANT_AUTH_WAITER_PASSWORD:}
restaurant.auth.accounts.host.username=${RESTAURANT_AUTH_HOST_USERNAME:host}
restaurant.auth.accounts.host.password=${RESTAURANT_AUTH_HOST_PASSWORD:}
